<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Your Cart - LuxeStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Unified Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <!-- Links Left -->
        <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link" th:href="@{/}">Home</a>
            <a class="nav-item nav-link" th:href="@{/}">Shop</a>
        </div>

        <!-- Brand Center -->
        <a class="navbar-brand" th:href="@{/}">LuxeStore</a>

        <!-- Links Right -->
        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link active font-weight-bold" th:href="@{/cart}">Cart</a>

            <form th:action="@{/logout}" method="post" style="display: inline;" sec:authorize="isAuthenticated()">
                <button type="submit" class="nav-item nav-link btn btn-link"
                    style="text-decoration: none; color: inherit;">Logout</button>
            </form>
        </div>
    </nav>


    <div class="container my-5 fade-in">
        <div class="row">
            <div class="col-lg-8">
                <h2 class="mb-4 font-weight-bold" style="color: #4a5568;">Shopping Cart</h2>

                <div th:if="${param.success}" class="alert alert-success border-0 shadow-sm rounded">
                    <i class="fas fa-check-circle mr-2"></i> Order placed successfully! Check your email.
                </div>

                <div th:if="${param.error}" class="alert alert-warning border-0 shadow-sm rounded">
                    <i class="fas fa-info-circle mr-2"></i> Your cart is empty!
                </div>

                <div class="card shadow-sm border-0 rounded overflow-hidden">
                    <table class="table table-hover mb-0">
                        <thead class="bg-light text-muted small text-uppercase">
                            <tr>
                                <th scope="col" class="border-0 pl-4">Product</th>
                                <th scope="col" class="border-0 text-right pr-4">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td class="pl-4 align-middle">
                                    <span class="font-weight-600 text-dark" th:text="${item.name}">Product Name</span>
                                </td>
                                <td class="text-right pr-4 align-middle">
                                    <span class="text-primary font-weight-bold"
                                        th:text="'$' + ${item.price}">$0.00</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(cartItems)}">
                                <td colspan="2" class="text-center py-5 text-muted">
                                    <i>Your cart is currently empty.</i>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-4">
                    <a th:href="@{/}" class="text-muted small font-weight-bold" style="text-decoration: none;">
                        <i class="fas fa-arrow-left mr-1"></i> CONTINUE SHOPPING
                    </a>
                </div>
            </div>

            <div class="col-lg-4 mt-5 mt-lg-0">
                <div class="card shadow-md border-0 rounded p-4">
                    <h5 class="font-weight-bold mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span class="font-weight-bold" th:text="'$' + ${total}">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-muted">Shipping</span>
                        <span class="text-success small font-weight-bold">FREE</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 align-items-center">
                        <span class="h5 mb-0">Total</span>
                        <span class="h4 mb-0 text-primary" th:text="'$' + ${total}">$0.00</span>
                    </div>

                    <a th:href="@{/checkout}"
                        class="btn btn-primary btn-block py-2 shadow-sm rounded-pill text-uppercase font-weight-bold small letter-spacing-1">
                        Checkout Now
                    </a>
                </div>

                <div class="mt-4 card shadow-sm border-0 p-4">
                    <h6 class="text-muted small text-uppercase font-weight-bold mb-3">Track Order</h6>
                    <form th:action="@{/bill/{id}(id=${orderId})}" method="get">
                        <div class="input-group">
                            <input class="form-control bg-light border-0" name="id" placeholder="Order ID"
                                style="border-radius: 8px 0 0 8px;">
                            <div class="input-group-append">
                                <button class="btn btn-secondary border-0" type="submit"
                                    style="border-radius: 0 8px 8px 0;">View</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
