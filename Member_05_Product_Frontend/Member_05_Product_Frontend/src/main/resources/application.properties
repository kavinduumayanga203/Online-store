
spring.application.name=online store

# Allow files up to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable method overrides for PUT/DELETE in HTML forms
spring.mvc.hiddenmethod.filter.enabled=true

# Mail (configure with your SMTP provider - example for Gmail using an app password)
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your-email@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Quick in-memory H2 configuration for local runs (development/demo)
# If you prefer MySQL, replace these settings and uncomment MySQL settings above.
# Persist H2 to disk so products survive restarts
spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console (visit /h2-console in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Debugging Login Error
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Fix for data.sql running before table creation (Removed as data.sql is now empty)
# spring.jpa.defer-datasource-initialization=true
