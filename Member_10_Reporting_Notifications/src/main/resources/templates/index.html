<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="ISO-8859-1">
    <title>Online Store</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light">
    <!-- Links Left -->
    <div class="navbar-nav mr-auto">
        <a class="nav-item nav-link" th:href="@{/}">Home</a>
        <a class="nav-item nav-link" th:href="@{/}">Shop</a>
    </div>

    <!-- Brand Center -->
    <a class="navbar-brand" href="#">LuxeStore</a>

    <!-- Links Right -->
    <div class="navbar-nav ml-auto">
        <a class="nav-item nav-link" th:href="@{/cart}">Cart</a>
        
        <a class="nav-item nav-link" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>

        <form th:action="@{/logout}" method="post" style="display: inline;" sec:authorize="isAuthenticated()">
            <button type="submit" class="nav-item nav-link btn btn-link" style="text-decoration: none; color: inherit;">Logout</button>
        </form>
    </div>
</nav>

<!-- Hero Section -->
<section class="hero fade-in">
    <div class="container">
        <h1>Elevate Your Lifestyle</h1>
        <p>Discover our curated collection of premium products designed to inspire.</p>
        <a href="#products" class="btn btn-hero">Shop Now</a>
    </div>
</section>

<div class="container my-5 fade-in" id="products">

    <!-- Search Bar (Styled) -->
    <div class="d-flex justify-content-center mb-5">
        <form th:action="@{/}" method="get" class="form-inline shadow-sm p-3 bg-white rounded" style="width: 100%; max-width: 600px;">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control border-0 mr-2 flex-grow-1" placeholder="Search for products..." style="box-shadow: none;" />
            <button type="submit" class="btn btn-primary px-4">Search</button>
            <button type="button" class="btn btn-light ml-2 rounded-circle" onclick="window.location='/'" title="Reset">✕</button>
        </form>
    </div>

    <div sec:authorize="hasRole('ADMIN')" class="mb-4 text-center">
        <a th:href="@{/showNewProductForm}" class="btn btn-success btn-lg shadow-sm">Add New Product</a>
    </div>

    <div class="row">
        <div class="col-md-4 col-sm-6 mb-4" th:each="product : ${listProducts}">
            <div class="card h-100">
                 <a th:href="@{/product/{id}(id=${product.id})}">
                    <img class="card-img-top" th:src="@{'/product-images/' + ${product.id} + '/' + ${product.imageUrl}}" 
                        alt="Product Image" onerror="this.onerror=null;this.src='https://via.placeholder.com/300?text=No+Image';">
                 </a>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-truncate">
                        <a th:href="@{/product/{id}(id=${product.id})}" th:text="${product.name}">Product Name</a>
                    </h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${#strings.abbreviate(product.description, 60)}">Desc</p>
                    
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <strong class="h5 mb-0 text-primary" th:text="'$' + ${product.price}">$0.00</strong>
                        
                        <div sec:authorize="hasRole('ADMIN')">
                            <form th:action="@{/deleteProduct/{id}(id=${product.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="_method" value="DELETE"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                            </form>
                        </div>
                        
                        <div sec:authorize="!hasRole('ADMIN')">
                            <a th:href="@{/addToCart/{id}(id=${product.id})}" class="btn btn-primary btn-sm px-3">Add to Cart</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-5">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <!-- Loop pages -->
                <li class="page-item" th:each="i: ${#numbers.sequence(0, totalPages - 1)}" 
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
            </ul>
        </nav>
    </div>
    
    <div class="footer">
        <p>&copy; 2025 LuxeStore. All rights reserved.</p>
    </div>
</div>

<script th:src="@{/js/theme.js}"></script>
</body>
</html>
