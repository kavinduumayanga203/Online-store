<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
    <title>Join LuxeStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Unified Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link" th:href="@{/}">Home</a>
        </div>

        <a class="navbar-brand" th:href="@{/}">LuxeStore</a>

        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link" th:href="@{/login}">Login</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card shadow-lg border-0 fade-in" style="width: 100%; max-width: 450px; border-radius: 20px;">
            <div class="card-body p-5">
                <h2 class="text-center font-weight-bold mb-2" style="color: #4a5568;">Create Account</h2>
                <p class="text-muted text-center mb-4 small">Join our community of premium shoppers</p>

                <div th:if="${error}" class="alert alert-danger small border-0 bg-danger text-white rounded">
                    <i class="fas fa-exclamation-triangle mr-1"></i> <span th:text="${error}">Error</span>
                </div>

                <form th:action="@{/saveUser}" method="post">
                    <div class="form-group mb-4">
                        <label class="text-muted small text-uppercase font-weight-bold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg bg-light border-0"
                            placeholder="name@example.com" required style="border-radius: 10px; font-size: 0.95rem;">
                    </div>

                    <div class="form-group mb-4">
                        <label class="text-muted small text-uppercase font-weight-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light border-0"
                            placeholder="Create a strong password" required
                            style="border-radius: 10px; font-size: 0.95rem;">
                    </div>

                    <input type="hidden" name="role" value="ROLE_USER">

                    <div class="form-group mt-5">
                        <button type="submit"
                            class="btn btn-primary btn-block btn-lg shadow text-uppercase letter-spacing-1"
                            style="border-radius: 50px; font-size: 0.9rem;">
                            Sign Up
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted">Already have an account?</span>
                    <a th:href="@{/login}" class="font-weight-bold ml-1" style="color: #667eea;">Log In</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
