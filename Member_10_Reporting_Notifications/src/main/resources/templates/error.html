<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
    <title>Error - LuxeStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container fade-in">
        <div class="card shadow-lg border-0 mx-auto rounded" style="max-width: 500px;">
            <div class="card-body text-center p-5">
                <div class="text-danger mb-3">
                    <i class="fas fa-exclamation-triangle fa-4x"></i>
                </div>

                <h2 class="font-weight-bold mb-2">Oops! Something went wrong</h2>
                <p class="text-muted small text-uppercase">Error Code: <span th:text="${status}">500</span></p>

                <div class="alert alert-light mt-4 text-left border rounded bg-light">
                    <p class="mb-1 font-weight-bold" th:text="${error}">An error has occurred</p>
                    <p class="mb-0 small text-muted" th:text="${message}">Detailed message</p>
                </div>

                <a th:href="@{/}" class="btn btn-primary btn-lg mt-4 shadow-sm px-4 rounded-pill">
                    <i class="fas fa-home mr-2"></i> Go Back Home
                </a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
