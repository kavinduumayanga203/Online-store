<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
    <title>Add Product - LuxeStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Unified Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link" th:href="@{/}">Home</a>
        </div>

        <a class="navbar-brand" th:href="@{/}">LuxeStore</a>

        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link" th:href="@{/cart}">Cart</a>
        </div>
    </nav>

    <div class="container my-5 fade-in">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded overflow-hidden">
                    <div class="card-header bg-white border-0 py-4 text-center">
                        <h3 class="font-weight-bold" style="color: #4a5568;">Add New Product</h3>
                        <p class="text-muted small mb-0">Expand your catalog with premium items</p>
                    </div>

                    <div class="card-body p-5">
                        <form th:action="@{/saveProduct}" th:object="${product}" method="POST"
                            enctype="multipart/form-data">

                            <!-- Hidden Fields -->
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{imageUrl}" />

                            <div class="form-group mb-4">
                                <label class="text-muted small text-uppercase font-weight-bold">Product Name</label>
                                <input type="text" th:field="*{name}"
                                    class="form-control form-control-lg bg-light border-0"
                                    placeholder="e.g. Modern Chair" required style="border-radius: 10px;">
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1">
                                    <i class="fas fa-exclamation-circle"></i> <span th:errors="*{name}">Name
                                        Error</span>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <label class="text-muted small text-uppercase font-weight-bold">Description</label>
                                <textarea th:field="*{description}" class="form-control bg-light border-0" rows="3"
                                    placeholder="Describe the product details..."
                                    style="border-radius: 10px;"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group mb-4">
                                        <label class="text-muted small text-uppercase font-weight-bold">Price
                                            ($)</label>
                                        <input type="number" step="0.01" th:field="*{price}"
                                            class="form-control form-control-lg bg-light border-0" placeholder="0.00"
                                            required style="border-radius: 10px;">
                                        <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1">
                                            <i class="fas fa-exclamation-circle"></i> <span th:errors="*{price}">Price
                                                Error</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group mb-4">
                                        <label class="text-muted small text-uppercase font-weight-bold">Upload
                                            Image</label>
                                        <div class="custom-file">
                                            <input type="file" name="image" accept="image/png, image/jpeg"
                                                class="custom-file-input" id="customFile">
                                            <label class="custom-file-label bg-light border-0" for="customFile"
                                                style="border-radius: 10px;">Choose file...</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group mt-4">
                                <button type="submit"
                                    class="btn btn-primary btn-lg btn-block shadow text-uppercase letter-spacing-1"
                                    style="border-radius: 50px;">
                                    Save Product
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-light border-0 text-center py-3">
                        <a th:href="@{/}" class="text-muted font-weight-bold small" style="text-decoration: none;">
                            Cancel and Return to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
    <script>
        // Custom file input label update
        document.querySelector('.custom-file-input').addEventListener('change', function (e) {
            var fileName = document.getElementById("customFile").files[0].name;
            var nextSibling = e.target.nextElementSibling
            nextSibling.innerText = fileName
        })
    </script>
</body>

</html>
