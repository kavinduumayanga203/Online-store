<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Login - LuxeStore</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<!-- Unified Navigation -->
<nav class="navbar navbar-expand-lg navbar-light">
    <div class="navbar-nav mr-auto">
        <a class="nav-item nav-link" th:href="@{/}">Home</a>
    </div>

    <a class="navbar-brand" th:href="@{/}">LuxeStore</a>

    <div class="navbar-nav ml-auto">
        <a class="nav-item nav-link" th:href="@{/register}">Register</a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 fade-in" style="width: 100%; max-width: 400px; border-radius: 20px;">
        <div class="card-body p-5">
            <h2 class="text-center font-weight-bold mb-4" style="color: #4a5568;">Welcome Back</h2>
            
            <form th:action="@{/login}" method="post">
                <div th:if="${param.error}" class="alert alert-danger small border-0 bg-danger text-white rounded">
                    <i class="fas fa-exclamation-circle mr-1"></i> Invalid email or password.
                </div>
                
                <div th:if="${param.logout}" class="alert alert-info small border-0 rounded">
                    <i class="fas fa-info-circle mr-1"></i> You have checked out.
                </div>
                
                <div class="form-group mb-4">
                    <label class="text-muted small text-uppercase font-weight-bold">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-lg bg-light border-0" 
                           placeholder="name@example.com" required 
                           style="border-radius: 10px; font-size: 0.95rem;">
                </div>
                
                <div class="form-group mb-4">
                    <label class="text-muted small text-uppercase font-weight-bold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light border-0" 
                           placeholder="••••••••" required 
                           style="border-radius: 10px; font-size: 0.95rem;">
                </div>
                
                <div class="form-group mt-5">
                    <button type="submit" class="btn btn-primary btn-block btn-lg shadow text-uppercase letter-spacing-1" 
                            style="border-radius: 50px; font-size: 0.9rem;">
                        Sign In
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <span class="text-muted">New here?</span> 
                <a th:href="@{/register}" class="font-weight-bold ml-1" style="color: #667eea;">Create Account</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/theme.js}"></script>
</body>
</html>
